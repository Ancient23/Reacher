# Reachy Fleet Supervisor — autonomous build roadmap (drive contract state)
# Ground truth for /drive-loop via .claude/commands/drive-roadmap.md.
# The orchestrator reads `status`; each worker does ONE unit, then updates this file + JOURNAL.md.
# Design detail for every unit lives in plan.md (§4 phases, §6 decisions #7–21).

meta:
  project: Reachy Fleet Supervisor
  design_doc: plan.md
  contract: .claude/commands/drive-roadmap.md
  journal: docs/roadmap/JOURNAL.md
  sentinel_prefix: ROADMAP_STATE   # final line: ROADMAP_STATE: CONTINUE|HUMAN_GATE|COMPLETE|FAILED

# gate types:
#   software  — fully autonomous; write tests + run them (may spawn REAL trivial `claude --bg`).
#   hardware  — needs the physical robot (motion / voice / vision); implement then HUMAN_GATE.
#   approval  — outward-facing / irreversible (publish); implement up to the action then HUMAN_GATE.
status:
  current_phase: 3
  next_unit: U15
  in_progress: "U15"
  failure_count: 0
  units_done: 14
  units_total: 26
  # Phase 2 COMPLETE (U1-U10). U11 (Phase 3 run_mode knob) DONE — software complete +
  # green; the optional RC LIVE-CONNECT check (claude.ai-OAuth steering) was SKIPPED by
  # explicit human choice (2026-06-30): the RC software path is complete and tested, the
  # live steering test is deferred, not required. Full U11 history is in JOURNAL.md.
  #
  # U12 (Phase 3) DONE — interactive controls (CLI + dashboard): fleet/control.py
  # FleetController (send / pause / resume / kill) shared by CLI + dashboard. Decision #16
  # open item RESOLVED + documented: in-place steer of a LIVE bg manager = `claude stop
  # <id>` FIRST (a live bg agent rejects `--resume … -p`), THEN `claude --resume
  # <sessionId> -p <msg>` continues its own conversation (the non-disruptive alternative
  # is `--resume --fork-session -p`, which branches a copy — not chosen). Verified by a
  # REAL bg steering round-trip in tests/fleet/test_manager.py. Fleet suite 261 green.
  #
  # U13 (Phase 3) DONE — managers run ralph/drive loops (decision #15). fleet/drive.py:
  # DriveLoopSpec + pure build_drive_task (the claude --bg prompt that runs a /drive-*
  # loop on a target repo AND emits its per-iteration status.json, escalating HUMAN_GATE
  # then stopping) + spawn_drive_manager (spawns via SessionManager, cwd=repo). Sentinel
  # flows into FleetState via the emitted status.json (U5/decision #21 primary path) PLUS
  # a FleetPoller fallback (derive_status_from_transcript -> status_from_transcript reads
  # the sentinel off the transcript tail; the live runtime enables it). Surfaced as a
  # `fleet drive` CLI command. INTEGRATION-VERIFIED: a real claude --bg manager drove a
  # trivial sample repo to a HUMAN_GATE that flowed into FleetState (test passed in ~24s,
  # session torn down). Fleet suite 273 green; 0 stray bg agents.
  #
  # U14 (Phase 3) DONE — gate policy (config default + per-worker override; decision #13).
  # fleet/config.py: GatePolicy.escalates/classify(trigger) (autonomous mode escalates only
  # escalate_on triggers, case-insensitive; gated mode escalates every non-empty trigger;
  # blank trigger = no gate) + module-level classify_status(policy, status) that plugs the
  # REAL gate signal (ManagerStatus sentinel) into the policy: FAILED always escalates,
  # HUMAN_GATE labelled via extra["gate_trigger"] follows the policy (bare gate always
  # escalates), other states autonomous. gate_trigger_of(status) reads the label. Precedence
  # mirrors run_mode/permission_mode: gate_policy_for(name, override=) = explicit per-worker >
  # project override > fleet default; classify_for / classify_status_for resolve+classify.
  # 10 new tests; fleet suite 283 green; 0 stray bg agents.
  #
  # U15 (Phase 3) IN PROGRESS — gate -> voice escalation (decision #17; HARDWARE).
  # PROBLEM-FIX PASS #2 (human live test 2026-07-01) — fleet suite 328 green (+9)
  # + 2 new openai_realtime tests. FOUR problems fixed in this pass:
  #   (P1) MOTION TOO BIG, esp. idle. Idle breathing amplitudes pulled out of
  #   moves.BreathingMove into NAMED constants and cut: antenna sway 15°->4°,
  #   z 5mm->2mm. Body signalling shrunk: BODY_YAW_SPAN_DEG 40°->18°, ANTENNA_POSES
  #   magnitudes ~halved (attention 45->20, working 15->7, done 30->13,
  #   failed -45->-20), ANTENNA_MAX 60->30 + new ANTENNA_SIGNAL_MAX_DEG=22 budget.
  #   Easing/smoothness (prior pass) kept. Tests assert the small yaw band, the
  #   antenna budget, and the gentle idle amplitude.
  #   (P2) DASHBOARD CARDS NOT WIDE. #grid was auto-fill minmax(400px) → packed
  #   narrow. Now a SINGLE full-width column by default (minmax(0,1fr)); a 2nd
  #   column only >=1400px and >=640px each; body max-width:none. Verified by
  #   rendering the served HTML + asserting the emitted CSS (auto-fill/400px gone).
  #   (P3) REACHY CUT PEOPLE OFF. turn_detection refactored into pure
  #   build_turn_detection() (server_vad) with NAMED constants:
  #   silence_duration_ms ~200->1000, prefix_padding_ms->400; unit-tested.
  #   (P4) WRONG GATE-REASON PHRASING (intermittent "waiting on an action" for a
  #   question). voice.gate_reason_category() classifies the waitingFor/gate reason
  #   (question|approval|generic); voice_phrase_for says "needs your answer" for a
  #   question, "needs your approval" for an approval ask, neutral "needs you" when
  #   the reason isn't known YET (never a wrong category). The renderer's
  #   edge-trigger signature folds in the category so a gate first spoken neutrally
  #   RE-announces with the question once waitingFor lands. Tested end-to-end.
  # (superseded) PROBLEM-FIX PASS #1 (human live test 2026-06-30) — +16 tests:
  #   (1) MISSED VOICE GATE root cause: speakable_kind only spoke a gate off the
  #   emitted HUMAN_GATE sentinel; a manager that merely BLOCKS waiting on the human
  #   (roster state=blocked / waitingFor set, no sentinel — e.g. Claude asked a
  #   clarifying question) returned None → silent. Fixed: speakable_kind now also
  #   maps a generic blocked/waiting roster row to VOICE_GATE (mirrors
  #   ManagerSnapshot.needs_attention + the body renderer), and voice_phrase_for
  #   folds in the waitingFor text. Verified end-to-end through the REAL
  #   FleetPoller->FleetState->FleetVoiceRenderer chain (test_integration) + a real
  #   bg probe (working->done spoke "finished").
  #   (2) DISAPPEARING CARD + missed gate SHARED root cause: a manager that emits
  #   its gate/completion then EXITS dropped out of the default `claude agents
  #   --json` roster, vanishing from FleetState (card gone; no terminal snapshot to
  #   speak). Fixed: build_fleet_runtime now polls with include_all=True so
  #   finished/gated bg managers are retained (status.json + log tail still resolve
  #   their state). Dashboard cards widened (minmax 400px) + taller wrapped
  #   transcript; disappearing-widget regression test added.
  #   (3) MOTION jerk (U8 human ask): added pure ease_in_out smoothstep in
  #   fleet/body.py (zero end-point velocity), applied in GotoQueueMove.evaluate,
  #   and bumped make_goto_applier duration 1.0->1.6s so turns glide. Easing math
  #   unit-tested (monotonic, bounded, no overshoot, reaches target, symmetric).
  # Still HARDWARE-gated (audio/voice/motion) — re-raised pending_gate below.
  #
  # Prior software baseline (unchanged): Voice is a
  # renderer of FleetState alongside the body: fleet/voice.py FleetVoiceRenderer
  # (edge-triggered FleetState subscriber) speaks on state CHANGES — task
  # COMPLETION, build/test FAILED, and HUMAN_GATE "needs you" — reusing U14
  # GatePolicy/classify_status so an autonomous gate stays silent and an
  # escalating one speaks (bare gate speaks by default). speakable_kind +
  # voice_phrase_for are pure/tested. The speak seam is
  # OpenaiRealtimeHandler.announce_fleet_event (+ speak_threadsafe bridge: the
  # poller fires from a worker thread, scheduled onto the realtime loop) modeled
  # on send_idle_signal; wired in main.py (_mount_fleet attaches the voice
  # renderer to the shared fleet_runtime.state). The RESUME-on-answer path is the
  # new answer_gate voice tool (profile) -> FleetController.send (claude --resume
  # -p, U12/decision #16) + persona instructions. HARDWARE gate: audio/voice
  # needs the physical robot, so the spoken path is human-verified (pending_gate).
  pending_gate: |
    U15 gate -> voice escalation (RE-RAISED after human test feedback 2026-07-01).
    Audio/voice + robot motion cannot be self-verified; please re-test on the robot.

    WHAT WAS FIXED since the last gate (all software-tested; fleet suite 328 green
    + 2 new realtime tests):
    - MOTION TOO BIG (esp. idle): idle breathing is now GENTLE (antenna sway 15°->4°,
      vertical 5mm->2mm) and gestures are SUBTLE (head-yaw range ±40°->±18°, antenna
      poses roughly halved). Amplitudes are named constants; motion stays smooth
      (easing kept) — this cut MAGNITUDE, not smoothness.
    - DASHBOARD CARDS NOW WIDE: a single full-width column (cards span the viewport;
      transcript finally has room), 2 columns only on very wide (>=1400px) screens.
      Stay-open-across-polls + card retention (poll --all) preserved.
    - REACHY WAITS LONGER before responding: turn-detection silence threshold raised
      ~200ms -> ~1000ms (+ more prefix padding) so it doesn't cut you off mid-sentence.
    - GATE PHRASING: Reachy now says it needs an ANSWER for a question (vs approval /
      neutral "needs you"), and no longer mislabels a question as "waiting on an action".

    SETUP
    1. Power the robot on the REAR USB-C port (validated-stable; front/USB-B browns out).
    2. Launch the app + fleet (from C:/Source/reacher):
         cd reachy_fleet_supervisor; ./run.ps1
       Wait until voice is live (you can talk to Reachy) and http://127.0.0.1:7860/fleet loads.

    TEST A — speak on COMPLETION (re-verify it still works)
    3. By VOICE: "Spawn a manager named greeter on C:/Source/reacher that creates a file
       hello.txt containing hi, then stop."  (Reachy calls spawn_manager; watch it on /fleet.)
    4. LISTEN: when it finishes, Reachy SPEAKS the completion aloud (e.g. "greeter finished
       its task"). LOOK: the greeter card stays on /fleet (does not vanish) and shows done.

    TEST B — speak on a GATE ("needs you") + resume by voice  (the fixed path)
    5. By VOICE: "Spawn a manager named builder on C:/Source/reacher that asks me a
       clarifying question and waits for my answer."  (This parks it blocked/waitingFor —
       the exact case that was silent before. A build that fails + reports HUMAN_GATE also works.)
    6. LISTEN: Reachy SPEAKS the escalation aloud. Because it is a QUESTION, Reachy should
       correctly say it needs an ANSWER to a question (e.g. "builder needs your answer:
       <the question>") — NOT "waiting on an action". LOOK: builder card is present and
       flagged for attention on /fleet.
    7. ANSWER BY VOICE, e.g.: "Tell builder to use port 8080 and continue."
       EXPECT: Reachy calls answer_gate and confirms aloud ("answered builder and resumed its
       work"); on /fleet builder leaves the gated state and continues.

    TEST C — dashboard width + motion (the re-tested asks)
    8. Open http://127.0.0.1:7860/fleet: confirm ALL spawned managers show as cards (none
       missing), the cards are WIDE (each spans the window width, transcript readable), and
       the transcript details expand AND stay open across the ~2s live polls.
    9. WATCH the robot: at IDLE the breathing should be SMALL/calm (gentle, not big sweeps),
       and when it turns between managers / signals attention the gesture should be SUBTLE
       and smooth (small yaw, eases in/out) — not big or abrupt.

    TEST D — listens long enough (don't-cut-me-off)
    10. Speak a SLOW sentence to Reachy with a deliberate mid-sentence pause. EXPECT: Reachy
        WAITS for you to finish before it responds (it should not jump in during the pause).

    CLEANUP
    11. By VOICE: "Stop and remove the greeter and builder managers"  (or `claude stop <id>`
        + `claude rm <id>` for each). Confirm `claude agents --json` shows no stray bg managers
        (your interactive sessions + run.ps1 app may remain).

    PASS if: (A) completion spoken + card stays; (B) the gate "needs you" is spoken AND, for a
    question, phrased as needing an ANSWER (not an action), and a spoken answer resumes the
    manager; (C) idle motion is small/calm + gestures subtle, and cards are WIDE + expandable;
    (D) Reachy waits for you to finish before acting. Report PASS, or describe exactly what
    was/wasn't spoken/seen/felt.

units:
  # ---------------- Phase 2 — Fleet core + observability + persistence ----------------
  - id: U1
    phase: 2
    title: Fleet config schema + loader
    gate: software
    status: done
    deps: []
    acceptance: "A `fleet` config (toml/json) lists projects {name, path, env, mcp[], defaults} and a default gate policy; typed loader + validation + tests."
  - id: U2
    phase: 2
    title: FleetManager over `claude --bg`
    gate: software
    status: done
    deps: [U1]
    acceptance: "Spawn a manager as a background agent (claude --bg --name --session-id --permission-mode … task), capture short id + sessionId; stop/rm; tests spawn a REAL trivial bg session, assert it appears in `claude agents --json`, then clean it up."
  - id: U3
    phase: 2
    title: SessionManager (track N + reconnect)
    gate: software
    status: done
    deps: [U2]
    acceptance: "Track N managers (spawn/list/stop); on startup reconnect to existing bg sessions from the daemon roster / `claude agents --json`. Tests cover reconnect-after-restart."
  - id: U4
    phase: 2
    title: FleetState model + poller (pub/sub)
    gate: software
    status: done
    deps: [U3]
    acceptance: "FleetState aggregates per-manager state by polling `claude agents --json` (+ logs); pub/sub so subscribers get updates; tests with fake + real bg sessions."
  - id: U5
    phase: 2
    title: Status convention (manager emits, fleet reads)  # decision #21
    gate: software
    status: done
    deps: [U4]
    acceptance: "Each manager writes a small status.json/journal (drive-loop report line) to a known place; FleetState merges it. Reachy/dashboard/CLI read status without interrupting the agent. Tested."
  - id: U6
    phase: 2
    title: Headless `fleet` CLI
    gate: software
    status: done
    deps: [U4]
    acceptance: "`fleet start|spawn|status|logs|stop` over SessionManager+FleetState — the headless dev/test harness. Tests drive it end-to-end against real trivial bg sessions."
  - id: U7
    phase: 2
    title: Read-only web dashboard
    gate: software
    status: done
    deps: [U4]
    acceptance: "FastAPI route on settings_app serving a 2–4 card grid rendering FleetState (status, tool, last line, transcript ring buffer) + a JSON poll endpoint; tests serve + assert HTTP/JSON. (Visual polish = optional light human check.)"
  - id: U8
    phase: 2
    title: Body renders FleetState
    gate: hardware
    status: done
    deps: [U4]
    acceptance: "Map fleet status → head/antenna signals (body yaw toward the manager needing attention; antenna = state). HUMAN_GATE: human powers robot (rear USB-C) and confirms the body signals the right manager."
  - id: U9
    phase: 2
    title: Per-agent identity (name/color) + 2–4 wiring
    gate: software
    status: done
    deps: [U4]
    acceptance: "Stable name + color per manager surfaced through FleetState/CLI/dashboard; designed for 2–4 concurrent. Tested."
  - id: U10
    phase: 2
    title: Phase 2 integration + docs
    gate: hardware
    status: done
    deps: [U5, U6, U7, U8, U9]
    acceptance: "Software integration test of the whole fleet core (autonomous). End-to-end with the robot (talk → spawn → observe on body + dashboard) = HUMAN_GATE. Update README/plan status."

  # ---------------- Phase 3 — Steering + plan-gated autonomy ----------------
  - id: U11
    phase: 3
    title: run_mode knob (background | remote-control)  # decision #19
    gate: software
    status: done
    deps: [U3]
    acceptance: "Manager model gains run_mode; background path fully wired+tested. remote-control spawn path implemented (claude --remote-control / server mode); RC live-connect verification = HUMAN_GATE (needs full claude.ai OAuth)."
  - id: U12
    phase: 3
    title: Interactive controls (CLI + dashboard)
    gate: software
    status: done
    deps: [U6, U7]
    acceptance: "approve gate / send message / pause-resume / spawn-kill / reassign. NB verify the non-interactive steering path for bg sessions (claude --resume <id> -p vs agent-view) — decision #16 open item; document the chosen mechanism. Tested."
  - id: U13
    phase: 3
    title: Managers run ralph/drive loops  # decision #15
    gate: software
    status: done
    deps: [U5]
    acceptance: "A manager can drive a /drive-* loop on its target repo; its HUMAN_GATE sentinel flows into FleetState. Integration tested (a manager driving a trivial sample repo)."
  - id: U14
    phase: 3
    title: Gate policy (config default + per-worker override)  # decision #13
    gate: software
    status: done
    deps: [U1, U13]
    acceptance: "Default gate policy in fleet config, overridable per worker/project; classification (autonomous vs escalate). Tested."
  - id: U15
    phase: 3
    title: Gate → voice escalation  # decision #17
    gate: hardware
    status: pending
    deps: [U13, U14]
    acceptance: "HUMAN_GATE surfaces to the Realtime host and is spoken; the spoken answer resumes the loop. HUMAN_GATE: confirm by voice on the robot."
    notes: "Backlog (from U8 hardware feedback 2026-06-28): also have Reachy SPEAK the fleet status aloud (e.g. on a state change / on request — 'build failed', 'tests needs you'), not just signal it on the body. Body + voice are complementary renderers of FleetState; voice plumbing belongs here."
  - id: U16
    phase: 3
    title: Written plan file per manager
    gate: software
    status: pending
    deps: [U13]
    acceptance: "A manager can be handed a plan.md-style file (task + gates = the drive contract's committed state). Tested."
  - id: U17
    phase: 3
    title: Voice interaction contract  # decision #20
    gate: hardware
    status: pending
    deps: [U11, U14]
    acceptance: "Persona + fleet-spawn tool: confirm task+location+run_mode (+non-default gates) by voice before kickoff ('just do it' skips); explain options + how to ask, with spoken examples. HUMAN_GATE: confirm on the robot."
  - id: U18
    phase: 3
    title: MCP-general per-worker MCP config
    gate: software
    status: pending
    deps: [U1, U2]
    acceptance: "Per-worker MCP servers wired through spawn (--mcp-config); a manager can drive an MCP-backed target (e.g. Unreal 5.8 MCP as a test target — config only, no hard dependency). Tested."

  # ---------------- Phase 4 — Vision + local backends ----------------
  - id: U19
    phase: 4
    title: Pluggable coding backend (Ollama local model)  # decision #14, option 1
    gate: software
    status: pending
    deps: [U2]
    acceptance: "Per-worker backend selection: Claude Code (Max) or Claude Code routed at a local Ollama model via ANTHROPIC_BASE_URL in the project's .claude/settings.json env (bg sessions don't inherit it from the shell, v2.1.174+). Config + tests; if no local Ollama present → HUMAN_GATE to set it up (ideally on the 5090)."
  - id: U20
    phase: 4
    title: Vision — worker-callable tool  # decision #9
    gate: hardware
    status: pending
    deps: [U13]
    acceptance: "A worker tool 'look at what I built': screen capture (digital) or robot camera (physical) → assessment back into the loop. Screen-capture path software-testable; robot-camera path = HUMAN_GATE. Reuse .phase0/vision_ref."
  - id: U21
    phase: 4
    title: Vision — supervisor observer
    gate: hardware
    status: pending
    deps: [U20]
    acceptance: "Reachy proactively glances + comments on fleet work. HUMAN_GATE: confirm on the robot."
  - id: U22
    phase: 4
    title: 5090 local voice mode (CUDA Whisper + neural TTS)
    gate: hardware
    status: pending
    deps: []
    acceptance: "OpenAI-free brain (CUDA Whisper + Kokoro/XTTS) as a fallback. HUMAN_GATE: needs the 5090 + audio hardware to verify."
  - id: U23
    phase: 4
    title: Rate-limit + robustness hardening
    gate: software
    status: pending
    deps: [U3]
    acceptance: "Backoff/handling for N managers sharing one Max pool; recovery paths. Tested."

  # ---------------- Phase 5 — Customization + share ----------------
  - id: U24
    phase: 5
    title: Customization (keys/models/projects/personas) + UI polish
    gate: software
    status: pending
    deps: [U7, U11]
    acceptance: "User-configurable keys, models, projects, personas; dashboard polish. Tested (visual = light human check)."
  - id: U25
    phase: 5
    title: Fleet skill (drive-loop variant for managers)  # decision #18
    gate: software
    status: pending
    deps: [U13]
    acceptance: "A skill installed into manager sessions: orchestrate via subagents/Workflows, short spoken replies, escalate HUMAN_GATE by voice. Tested headless."
  - id: U26
    phase: 5
    title: Package + publish as a Reachy Mini app on Hugging Face
    gate: approval
    status: pending
    deps: [U24, U25]
    acceptance: "Package the app; sort licensing (Pollen base + additions) + secrets handling. Implement up to the publish step, then HUMAN_GATE for explicit go-ahead. NEVER publish autonomously."
