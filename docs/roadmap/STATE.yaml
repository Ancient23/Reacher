# Reachy Fleet Supervisor — autonomous build roadmap (drive contract state)
# Ground truth for /drive-loop via .claude/commands/drive-roadmap.md.
# The orchestrator reads `status`; each worker does ONE unit, then updates this file + JOURNAL.md.
# Design detail for every unit lives in plan.md (§4 phases, §6 decisions #7–21).

meta:
  project: Reachy Fleet Supervisor
  design_doc: plan.md
  contract: .claude/commands/drive-roadmap.md
  journal: docs/roadmap/JOURNAL.md
  sentinel_prefix: ROADMAP_STATE   # final line: ROADMAP_STATE: CONTINUE|HUMAN_GATE|COMPLETE|FAILED

# gate types:
#   software  — fully autonomous; write tests + run them (may spawn REAL trivial `claude --bg`).
#   hardware  — needs the physical robot (motion / voice / vision); implement then HUMAN_GATE.
#   approval  — outward-facing / irreversible (publish); implement up to the action then HUMAN_GATE.
status:
  current_phase: 3
  next_unit: U17
  in_progress: U17
  failure_count: 0
  units_done: 16
  units_total: 26
  pending_gate:
    unit: U17
    title: Voice interaction contract (decision #20)
    what_was_built: >
      fleet/voice_contract.py (wants_immediate_kickoff, sounds_like_confirmation,
      summarize_spawn_confirmation, EXPLAIN_OPTIONS_TEXT) + spawn_manager tool's
      new confirmed:boolean param (first call without confirmed returns a spoken
      readback and does NOT spawn; a second call with confirmed=true, or an
      up-front "just do it", spawns) + persona instructions.txt updated to speak
      the confirm-before-kickoff flow and explain options on request. All
      software-testable pieces are green (fleet suite 347, tools suite 36); only
      whether it SOUNDS right and works by voice on the robot needs a human check.
    steps: |
      1. Power on the Reachy Mini Lite via the REAR USB-C port (front/USB-B
         browns out the motors) and start the app per CLAUDE.md / run.ps1:
             cd reachy_fleet_supervisor
             ./run.ps1
      2. Test A (normal confirm flow): say "spawn a manager called tester on
         <some project path or name> to <a short task>". LISTEN for Reachy to
         read back the task, project, and (if non-default) run mode/permission
         mode, ending with "Say go ahead, or tell me what to change." It must
         NOT spawn yet (no dashboard card / body signal for it).
      3. Say "go ahead" (or "yes" / "sounds good"). LISTEN/LOOK for Reachy to
         confirm it started and for the manager to actually appear on the
         dashboard (http://localhost:<port>/fleet) and register on the body.
      4. Test B (skip phrase): say "spawn a manager called quick on <project>
         to <task>, just do it". LISTEN for Reachy to skip the readback and
         spawn immediately (no confirmation question).
      5. Test C (correction): repeat step 2, then when Reachy reads back,
         say something like "no, use the other project instead" or "actually
         make it remote-control mode". LISTEN for Reachy to adjust and read
         back again (not spawn on the uncorrected settings).
      6. Test D (explain options): ask "what are my options?" or "how do I
         run this remotely?". LISTEN for a short, natural spoken explanation
         (background vs remote-control, permission mode, the skip phrase) with
         a spoken example request.
      Report PASS/PROBLEM per test (A-D) back to the loop; a PROBLEM should
      describe what was heard/seen vs. expected so the next worker can fix it
      in place (U17 stays in_progress until confirmed).
