# Reachy Fleet Supervisor — autonomous build roadmap (drive contract state)
# Ground truth for /drive-loop via .claude/commands/drive-roadmap.md.
# The orchestrator reads `status`; each worker does ONE unit, then updates this file + JOURNAL.md.
# Design detail for every unit lives in plan.md (§4 phases, §6 decisions #7–21).

meta:
  project: Reachy Fleet Supervisor
  design_doc: plan.md
  contract: .claude/commands/drive-roadmap.md
  journal: docs/roadmap/JOURNAL.md
  sentinel_prefix: ROADMAP_STATE   # final line: ROADMAP_STATE: CONTINUE|HUMAN_GATE|COMPLETE|FAILED

# gate types:
#   software  — fully autonomous; write tests + run them (may spawn REAL trivial `claude --bg`).
#   hardware  — needs the physical robot (motion / voice / vision); implement then HUMAN_GATE.
#   approval  — outward-facing / irreversible (publish); implement up to the action then HUMAN_GATE.
status:
  current_phase: 2
  next_unit: U10
  in_progress: U10
  failure_count: 0
  units_done: 9
  units_total: 26
  # U8 (Body renders FleetState) CONFIRMED PASS by the human on the refreshed demo
  # ("Pass, all looks good"): body turns toward the flagged manager (two opposite
  # directions at steps 2 & 3), antennas droop clearly DOWN on failure and HOLD, turn
  # is acceptably smooth. U8 marked done. Now on U10 — Phase 2 integration capstone.
  #
  # U10 HUMAN_GATE: software integration test of the whole fleet core is GREEN
  # (tests/fleet/test_integration.py — real bg session driven through SessionManager →
  # FleetState poll → CLI + dashboard + body renderer all render it; cleaned up, 0 stray
  # agents). README + plan.md Phase-2 status updated. The end-to-end ON-ROBOT run
  # (talk → spawn → observe on body AND dashboard) cannot be self-verified → gated.
  #
  # U10 GATE PROBLEM #1 (2026-06-29) — human ran the live E2E: "robot is working /
  # interacting with a repo but I see NOTHING in the dashboard at /fleet." ROOT CAUSE =
  # integration wiring the isolated tests didn't cover, TWO disconnects:
  #   (a) the RUNNING app (main.run, launched by run.ps1) built the voice/gradio app but
  #       NEVER mounted the /fleet dashboard nor started a FleetPoller → /fleet 404'd and
  #       no FleetState was ever refreshed; and
  #   (b) the only voice coding tool (ask_claude_code) runs an IN-PROCESS WorkerSession
  #       (claude_brain.py) which is NOT a `claude --bg` agent, so it never appears in
  #       `claude agents --json` — the exact roster the poller reads. Voice-spawn path and
  #       fleet-observability path were not wired to each other.
  # FIX (this iteration): new fleet/runtime.py = process-wide FleetRuntime (shared
  # FleetState + SessionManager + started FleetPoller) + mount_fleet_dashboard(); main.run
  # now mounts /fleet onto settings_app and starts the poller (both gradio + headless
  # branches) and stops it on shutdown; NEW voice tool `spawn_manager` (profile tool +
  # tools.txt + instructions) routes spawns through runtime.session_manager so a
  # voice-spawned `claude --bg` manager is roster-visible → poller → FleetState → dashboard
  # + body. ask_claude_code stays as the quick in-process delegate (intentionally NOT
  # fleet-visible). New software wiring tests: tests/fleet/test_app_wiring.py (mount serves
  # /fleet over shared state; get_fleet_runtime is a started singleton; voice spawn_manager
  # → roster → FleetState → dashboard end-to-end with a fake roster). Fleet suite 181 green;
  # 0 stray bg agents. RESIDUAL only confirmable on the robot: the real browser at
  # http://127.0.0.1:7860/fleet showing the live card + body agreeing → re-emitted gate.
  #
  # U10 GATE PROBLEM #2 (2026-06-29) — human ran the live dashboard: the
  # manager CARDS rendered correctly (names, stable colors, BLOCKED/WORKING
  # state badges, live "updated" timestamp) but TWO RENDERING bugs:
  #   BUG 1 GARBLED TEXT — card last-line + transcript showed RAW VT/ANSI control
  #     sequences literally ([38;2;255;107;128m, [K, [200C, [48;3H, [?25h, [m;
  #     □ glyphs = ESC 0x1b). ROOT CAUSE: `claude logs <id>` returns raw TUI
  #     output (SGR colours + cursor/erase/private-mode control seqs); we
  #     stored/rendered it verbatim. FIX: shared sanitizer in fleet/state.py
  #     (strip_ansi + sanitize_lines: strip CSI/OSC/two-char escapes + stray C0
  #     bytes, DROP lines empty after stripping like pure `[K`), applied at
  #     INGESTION in FleetState.apply() — the single chokepoint feeding the
  #     transcript ring buffer — so dashboard + CLI + body headline ALL get clean
  #     text. BUG 2 DISCLOSURE AUTO-CLOSES — transcript is in <details>; the live
  #     poll rebuilt grid.innerHTML each poll_ms, resetting <details open>→closed
  #     + scroll, so an opened transcript snapped shut on the next ~2s poll. FIX:
  #     served JS now captureUi(grid) (per-card open + pre.scrollTop, keyed by
  #     stable data-key) BEFORE the innerHTML rebuild and restoreUi(grid,ui)
  #     AFTER. Tests: +6 in test_state.py (sanitizer + apply-at-ingestion), +2 in
  #     test_dashboard.py (sanitized card/JSON; served JS has the capture/restore
  #     mechanism keyed by data-key — JS runtime is the human's visual gate).
  #     Fleet suite 189 green; 0 stray bg agents. NOTE: raw `claude logs` TUI
  #     content is inherently noisy; the cleaner long-term signal is each
  #     manager's emitted status.json (U5) — sanitizing is the right fix for now.
  #     RESIDUAL only the human can confirm: the app must be RESTARTED to load the
  #     new dashboard code, then visually confirm clean text + a transcript that
  #     stays open across polls → gate RE-EMITTED below.
  #
  # Idle-breathing decision (carried from U8 note): in LIVE operation the body renderer
  # only commands a pose on change, so idle BreathingMove reverts a signalled pose to
  # neutral ~1s later. Decision: ACCEPT the momentary glance for fleet signalling (do
  # NOT permanently suppress breathing — a frozen, non-breathing robot reads as "dead"
  # and breathing is core to the Pollen persona). Instead, on a state CHANGE that needs
  # attention the renderer re-asserts the pose briefly (a short hold), then lets
  # breathing resume; the dashboard is the always-on truth, the body is a glanceable
  # nudge. This is a per-update concern, NOT continuous suppression. See plan.md §6 #21
  # follow-up + body.py FleetBodyRenderer(hold_seconds=...). Covered in the integration
  # test at the software level (renderer re-asserts on attention changes via the applier
  # hold hook); the felt "glance vs hold" timing is part of the on-robot HUMAN_GATE.
  pending_gate: |
    U10 — Phase 2 integration capstone: END-TO-END ON-ROBOT run (HARDWARE) — RE-EMITTED
    after fixing the TWO reported dashboard RENDERING bugs (see GATE PROBLEM #2 notes
    above). The cards already rendered correctly last time (names/colors/states/live
    timestamp); this round is to confirm the two display fixes look right in the browser.

    WHAT CHANGED SINCE YOUR LAST RUN (both are dashboard/transcript display fixes):
      - BUG 1 fixed — transcript/last-line text is now SANITIZED at ingestion: raw
        terminal escape codes from `claude logs` ([38;2;…m, [K, [200C, [?25h, □ ESC
        glyphs) are stripped before they reach the dashboard/CLI/body, and all-escape
        lines (pure [K) are dropped. Text should now be CLEAN and legible.
      - BUG 2 fixed — opening "▼ transcript" now STAYS open across the ~2s live polls
        (and keeps its scroll position); previously each poll snapped it shut.
    >> YOU MUST RESTART THE APP to load the new dashboard code: Ctrl-C the running
       run.ps1, then relaunch it. A browser refresh alone is NOT enough — the page's
       served HTML/JS is generated by the app process.

    Everything else is unchanged: to see a card you still must ask Reachy to "SPAWN A
    MANAGER" (spawn_manager → a durable, dashboard-visible `claude --bg` manager). Plain
    "go fix X in my repo" uses ask_claude_code (in-process, by design NOT on the dashboard).

    DO THIS:
      1. Power the Reachy Mini ON via the REAR USB-C port (NOT the front/USB-B port —
         it browns out the motors). Wait for the daemon/motor backend to come up
         (run.ps1 gates on the motor backend, not just HTTP).
      2. RESTART the app to load the new dashboard code (voice brain + body + dashboard).
         If it's already running, Ctrl-C it first, then from the repo root:
             pwsh -File reachy_fleet_supervisor/run.ps1
         Wait until it reports the app is up and the motor backend is ready. (Tip: if
         the page 404s, check reachy_fleet_supervisor/.logs/app.err.log for a line like
         "Fleet dashboard mounted at /fleet".)
      3. Open the web dashboard in a browser (the read-only fleet view):
             http://127.0.0.1:7860/fleet
         The page shows a 2-4 card grid and should start EMPTY ("No managers running.").
         Quick check it's served: http://127.0.0.1:7860/fleet/healthz returns {"ok":true}
         and http://127.0.0.1:7860/fleet/api/fleet returns JSON with "managers": [].
      4. By VOICE, explicitly ask Reachy to SPAWN A MANAGER on a real local project, e.g.:
             "Spawn a manager called tester on C:\\Source\\<some-repo> to run the tests."
         Give a real path on disk and any trivial real task. Reachy should confirm it
         spawned a manager. (This calls spawn_manager → a live `claude --bg` session.)
      5. CONFIRM THE TWO FIXES on the dashboard card for "tester":
         (a) CLEAN TEXT — the headline/last-line and the transcript are now legible
             words, with NO raw escape codes ([38;2;…m, [K, [200C, [?25h) and NO □ ESC
             glyphs, and NO rows that are blank/just "[K".
         (b) DISCLOSURE STAYS OPEN — click "▼ transcript" to open it and WAIT through
             several ~2s refreshes: it must STAY OPEN (and not jump scroll) while new
             lines stream in. Previously it snapped shut on the next poll.
      6. WATCH BOTH RENDERERS (unchanged from last gate):
         ON THE DASHBOARD (refreshes ~2s): the CARD shows name + stable color dot, a
           state badge (working/attention/done), current tool, and the transcript filling
           in (now clean).
         ON THE BODY: the TORSO turns toward that manager's slot, ANTENNAS show its state
           (slightly up = working). When steadily working the body may relax into the
           breathing idle between changes (by design); the clear HELD signal is on a state
           CHANGE — let it finish or hit a gate → body should perk (attention) / settle
           (done), and the dashboard badge should match.
      7. Confirm body and dashboard AGREE on WHO needs attention and WHAT state it's in.
      8. SOFTWARE SANITY CHECK (run in another terminal while the manager is up) — proves
         the voice spawn really is a roster-visible bg agent the poller can see:
             claude agents --json
         You should see a "kind":"background" entry named "tester". (The dashboard reads
         exactly this roster.)
      9. Stop everything: Ctrl-C the app; then ensure NO stray agents remain:
             claude agents --json                  # should NOT list "tester"
             claude stop <id> && claude rm <id>     # if it lingers

    REPORT BACK:
      - PASS if: card text is now CLEAN/legible (no escape codes / □ glyphs / blank-[K
        rows), opening "▼ transcript" STAYS open across updates, the explicit "spawn a
        manager" voice request fired, "tester" showed in `claude agents --json` as a
        background agent, a CARD appeared (correct name/color/state) AND the body reacted
        (turned toward it / antennas matched), and the two renderers agreed. The momentary
        breathing "glance" between changes is acceptable.
      - PROBLEM (describe what you saw) otherwise, and say WHERE it broke:
          * Still garbled text → app wasn't restarted (most likely), or a new escape
            class the sanitizer misses (paste an example raw line).
          * Transcript still snaps shut on poll → app wasn't restarted, or the served JS
            capture/restore didn't run (check the browser console; the served page must
            contain captureUi/restoreUi).
          * Reachy didn't spawn / used the wrong tool → voice→spawn_manager wiring
            (persona instructions / tool selection).
          * `claude agents --json` shows the manager but the dashboard card never appears
            → poller/mount (check the "Fleet dashboard mounted" log + /fleet/api/fleet).
          * /fleet itself 404s → mount didn't run (settings_app host/port; app.err.log).
          * Card appears but body didn't react → renderer attach/applier (the body
            renderer is NOT yet attached to the live runtime — SEE NEXT-ITERATION NOTE).
          * Body and dashboard disagree → mapping; motor brownout/errors → power/USB.

    NEXT-ITERATION NOTE (known residual, software): main.run mounts the dashboard + poller
    and the voice spawn is now fleet-visible, but the BODY renderer (FleetBodyRenderer)
    is not yet attached to the shared FleetRuntime.state in main.run — on the robot the
    body motion today is driven by openai_realtime's own status, not by FleetState. If the
    dashboard shows the manager but the body doesn't react to fleet state, that attach is
    the remaining wire (subscribe a FleetBodyRenderer with a make_goto_applier over the
    movement_manager to runtime.state). The dashboard half of this gate is the priority
    fix that was reported; flag the body half if observed.

units:
  # ---------------- Phase 2 — Fleet core + observability + persistence ----------------
  - id: U1
    phase: 2
    title: Fleet config schema + loader
    gate: software
    status: done
    deps: []
    acceptance: "A `fleet` config (toml/json) lists projects {name, path, env, mcp[], defaults} and a default gate policy; typed loader + validation + tests."
  - id: U2
    phase: 2
    title: FleetManager over `claude --bg`
    gate: software
    status: done
    deps: [U1]
    acceptance: "Spawn a manager as a background agent (claude --bg --name --session-id --permission-mode … task), capture short id + sessionId; stop/rm; tests spawn a REAL trivial bg session, assert it appears in `claude agents --json`, then clean it up."
  - id: U3
    phase: 2
    title: SessionManager (track N + reconnect)
    gate: software
    status: done
    deps: [U2]
    acceptance: "Track N managers (spawn/list/stop); on startup reconnect to existing bg sessions from the daemon roster / `claude agents --json`. Tests cover reconnect-after-restart."
  - id: U4
    phase: 2
    title: FleetState model + poller (pub/sub)
    gate: software
    status: done
    deps: [U3]
    acceptance: "FleetState aggregates per-manager state by polling `claude agents --json` (+ logs); pub/sub so subscribers get updates; tests with fake + real bg sessions."
  - id: U5
    phase: 2
    title: Status convention (manager emits, fleet reads)  # decision #21
    gate: software
    status: done
    deps: [U4]
    acceptance: "Each manager writes a small status.json/journal (drive-loop report line) to a known place; FleetState merges it. Reachy/dashboard/CLI read status without interrupting the agent. Tested."
  - id: U6
    phase: 2
    title: Headless `fleet` CLI
    gate: software
    status: done
    deps: [U4]
    acceptance: "`fleet start|spawn|status|logs|stop` over SessionManager+FleetState — the headless dev/test harness. Tests drive it end-to-end against real trivial bg sessions."
  - id: U7
    phase: 2
    title: Read-only web dashboard
    gate: software
    status: done
    deps: [U4]
    acceptance: "FastAPI route on settings_app serving a 2–4 card grid rendering FleetState (status, tool, last line, transcript ring buffer) + a JSON poll endpoint; tests serve + assert HTTP/JSON. (Visual polish = optional light human check.)"
  - id: U8
    phase: 2
    title: Body renders FleetState
    gate: hardware
    status: done
    deps: [U4]
    acceptance: "Map fleet status → head/antenna signals (body yaw toward the manager needing attention; antenna = state). HUMAN_GATE: human powers robot (rear USB-C) and confirms the body signals the right manager."
  - id: U9
    phase: 2
    title: Per-agent identity (name/color) + 2–4 wiring
    gate: software
    status: done
    deps: [U4]
    acceptance: "Stable name + color per manager surfaced through FleetState/CLI/dashboard; designed for 2–4 concurrent. Tested."
  - id: U10
    phase: 2
    title: Phase 2 integration + docs
    gate: hardware
    status: in_progress
    deps: [U5, U6, U7, U8, U9]
    acceptance: "Software integration test of the whole fleet core (autonomous). End-to-end with the robot (talk → spawn → observe on body + dashboard) = HUMAN_GATE. Update README/plan status."

  # ---------------- Phase 3 — Steering + plan-gated autonomy ----------------
  - id: U11
    phase: 3
    title: run_mode knob (background | remote-control)  # decision #19
    gate: software
    status: pending
    deps: [U3]
    acceptance: "Manager model gains run_mode; background path fully wired+tested. remote-control spawn path implemented (claude --remote-control / server mode); RC live-connect verification = HUMAN_GATE (needs full claude.ai OAuth)."
  - id: U12
    phase: 3
    title: Interactive controls (CLI + dashboard)
    gate: software
    status: pending
    deps: [U6, U7]
    acceptance: "approve gate / send message / pause-resume / spawn-kill / reassign. NB verify the non-interactive steering path for bg sessions (claude --resume <id> -p vs agent-view) — decision #16 open item; document the chosen mechanism. Tested."
  - id: U13
    phase: 3
    title: Managers run ralph/drive loops  # decision #15
    gate: software
    status: pending
    deps: [U5]
    acceptance: "A manager can drive a /drive-* loop on its target repo; its HUMAN_GATE sentinel flows into FleetState. Integration tested (a manager driving a trivial sample repo)."
  - id: U14
    phase: 3
    title: Gate policy (config default + per-worker override)  # decision #13
    gate: software
    status: pending
    deps: [U1, U13]
    acceptance: "Default gate policy in fleet config, overridable per worker/project; classification (autonomous vs escalate). Tested."
  - id: U15
    phase: 3
    title: Gate → voice escalation  # decision #17
    gate: hardware
    status: pending
    deps: [U13, U14]
    acceptance: "HUMAN_GATE surfaces to the Realtime host and is spoken; the spoken answer resumes the loop. HUMAN_GATE: confirm by voice on the robot."
    notes: "Backlog (from U8 hardware feedback 2026-06-28): also have Reachy SPEAK the fleet status aloud (e.g. on a state change / on request — 'build failed', 'tests needs you'), not just signal it on the body. Body + voice are complementary renderers of FleetState; voice plumbing belongs here."
  - id: U16
    phase: 3
    title: Written plan file per manager
    gate: software
    status: pending
    deps: [U13]
    acceptance: "A manager can be handed a plan.md-style file (task + gates = the drive contract's committed state). Tested."
  - id: U17
    phase: 3
    title: Voice interaction contract  # decision #20
    gate: hardware
    status: pending
    deps: [U11, U14]
    acceptance: "Persona + fleet-spawn tool: confirm task+location+run_mode (+non-default gates) by voice before kickoff ('just do it' skips); explain options + how to ask, with spoken examples. HUMAN_GATE: confirm on the robot."
  - id: U18
    phase: 3
    title: MCP-general per-worker MCP config
    gate: software
    status: pending
    deps: [U1, U2]
    acceptance: "Per-worker MCP servers wired through spawn (--mcp-config); a manager can drive an MCP-backed target (e.g. Unreal 5.8 MCP as a test target — config only, no hard dependency). Tested."

  # ---------------- Phase 4 — Vision + local backends ----------------
  - id: U19
    phase: 4
    title: Pluggable coding backend (Ollama local model)  # decision #14, option 1
    gate: software
    status: pending
    deps: [U2]
    acceptance: "Per-worker backend selection: Claude Code (Max) or Claude Code routed at a local Ollama model via ANTHROPIC_BASE_URL in the project's .claude/settings.json env (bg sessions don't inherit it from the shell, v2.1.174+). Config + tests; if no local Ollama present → HUMAN_GATE to set it up (ideally on the 5090)."
  - id: U20
    phase: 4
    title: Vision — worker-callable tool  # decision #9
    gate: hardware
    status: pending
    deps: [U13]
    acceptance: "A worker tool 'look at what I built': screen capture (digital) or robot camera (physical) → assessment back into the loop. Screen-capture path software-testable; robot-camera path = HUMAN_GATE. Reuse .phase0/vision_ref."
  - id: U21
    phase: 4
    title: Vision — supervisor observer
    gate: hardware
    status: pending
    deps: [U20]
    acceptance: "Reachy proactively glances + comments on fleet work. HUMAN_GATE: confirm on the robot."
  - id: U22
    phase: 4
    title: 5090 local voice mode (CUDA Whisper + neural TTS)
    gate: hardware
    status: pending
    deps: []
    acceptance: "OpenAI-free brain (CUDA Whisper + Kokoro/XTTS) as a fallback. HUMAN_GATE: needs the 5090 + audio hardware to verify."
  - id: U23
    phase: 4
    title: Rate-limit + robustness hardening
    gate: software
    status: pending
    deps: [U3]
    acceptance: "Backoff/handling for N managers sharing one Max pool; recovery paths. Tested."

  # ---------------- Phase 5 — Customization + share ----------------
  - id: U24
    phase: 5
    title: Customization (keys/models/projects/personas) + UI polish
    gate: software
    status: pending
    deps: [U7, U11]
    acceptance: "User-configurable keys, models, projects, personas; dashboard polish. Tested (visual = light human check)."
  - id: U25
    phase: 5
    title: Fleet skill (drive-loop variant for managers)  # decision #18
    gate: software
    status: pending
    deps: [U13]
    acceptance: "A skill installed into manager sessions: orchestrate via subagents/Workflows, short spoken replies, escalate HUMAN_GATE by voice. Tested headless."
  - id: U26
    phase: 5
    title: Package + publish as a Reachy Mini app on Hugging Face
    gate: approval
    status: pending
    deps: [U24, U25]
    acceptance: "Package the app; sort licensing (Pollen base + additions) + secrets handling. Implement up to the publish step, then HUMAN_GATE for explicit go-ahead. NEVER publish autonomously."
