  # .claude/settings.json env WITHOUT clobbering other keys; claude backend
  # writes nothing). ProjectDefaults.backend + FleetConfig.backend +
  # backend_for(name, override=) mirror the run_mode/permission_mode
  # precedence pattern exactly. SessionManager.spawn_project materializes the
  # effective backend into <project.path>/.claude/settings.json BEFORE spawn
  # (a bg session has no shell to inherit ANTHROPIC_BASE_URL from,
  # v2.1.174+). 16 new tests; fleet suite 367 green; 0 stray bg agents.
  # Local Ollama IS present on this machine (localhost:11434) so the
  # acceptance's "no Ollama -> HUMAN_GATE to set it up" branch didn't apply;
  # a LIVE spawn-through-Ollama smoke test was judged out of scope for this
  # unit (acceptance = "config + tests") and left as a natural follow-up.
  #
  # U20 (Phase 4) DONE (software; camera check deferred, see deferred_gates) —
  # vision worker tool (decision #9). fleet/vision.py: capture_screen
  # (PIL.ImageGrab all-monitors, downscaled JPEG; injectable grabber) +
  # capture_robot_camera (injectable frame_provider seam; WITHOUT the robot it
  # raises RobotCameraUnavailable — never fakes a perceptual check) +
  # build_assessment_prompt/assess_image (one-shot `claude -p <prompt>
  # --allowedTools Read`, Max plan, no API key — the .phase0/vision_ref CLI
  # pattern) + look() (capture -> assess -> LookResult; temp captures cleaned
  # up) + look_command() (uv run --project ... fleet look argv prefix so a
  # worker in ANY repo reaches the supervisor venv). Worker wiring: new
  # `fleet look <question> [--source screen|camera --image --out --keep
  # --timeout --json]` CLI command (camera w/o robot = exit 2), and
  # DriveLoopSpec.vision_command — when set, build_drive_task advertises the
  # tool in the manager's prompt so assessments feed back into its loop.
  # 27 new tests incl. a real-desktop screen-grab smoke test (auto-skips
  # headless); fleet+tools suites 437 green; 0 stray bg agents.
  #
  # U22 (Phase 4) PENDING, SKIPPED FOR NOW — needs the 5090 + audio hardware to
  # build/verify (CUDA Whisper + neural TTS local voice mode); not available on
  # this machine currently. Left pending, not blocking; U23 done in its place.
  #
  # U23 (Phase 4) DONE — rate-limit + robustness hardening for N managers
  # sharing one Max-plan pool. fleet/resilience.py: is_rate_limit_error (pure
  # substring classifier over Claude CLI stderr/stdout — "rate limit", "429",
  # "usage limit", "overloaded", "capacity", "please try again/retry" etc.) +
  # RetryPolicy (max_attempts/base_delay/max_delay/multiplier/jitter, validated)
  # + compute_backoff_delay (pure exponential+jitter, capped) + retry_call
  # (generic retry wrapper: retries ONLY a rate-limit-shaped error with backoff,
  # any other error fails fast immediately, injectable sleep/rand for
  # deterministic tests) + classify_manager_health (healthy | recoverable
  # [roster still lists it failed/stopped] | missing [dropped off the roster
  # entirely]) + recover_manager (respawns a "recoverable" manager via `claude
  # respawn`, itself retried through retry_call so a respawn that ALSO hits the
  # shared pool's rate limit backs off and retries). Wired into
  # SessionManager.spawn / send_message (retry_policy kwarg, defaults ON,
  # opt-out with retry_policy=None — pre-U23 behavior unchanged) and new
  # SessionManager.health/recover/recover_all (best-effort sweep of every
  # tracked manager, one failure doesn't stop the rest). 46 new tests
  # (resilience unit tests + SessionManager wiring, all mocked — no real bg
  # spawns needed since the whole point is the retry/backoff LOGIC). Fleet
  # suite green (520 passed across the whole software suite; only the 2
  # pre-existing profile-loading failures remain, unrelated). One stray
  # u12-steer bg agent left over from a PRIOR iteration's test run was found
  # via `claude agents --json` and stopped/removed during this iteration's
  # verification (not created by this unit's tests, which are fully mocked).
  #
  # U24 (Phase 5) DONE — customization (keys/models/projects/personas) + UI
  # polish. fleet/config.py: PersonaConfig (name/voice/instructions, U24's
  # persona shape) + ProjectDefaults.persona (project-level persona name
  # reference) + FleetConfig.model / FleetConfig.personas / FleetConfig.persona
  # (fleet-wide defaults) + two new validators (unique persona names; every
  # persona *reference* — fleet-wide or per-project — must name a defined
  # persona, fails loudly at load time like every other config typo) + new
  # resolvers model_for(name, override=) and persona_for(name, override=)
  # mirroring the existing override>project>fleet precedence pattern
  # (backend_for/run_mode_for/permission_mode_for). Along the way, fixed a
  # latent bug in session_manager.spawn_project: it read
  # project.defaults.model directly, silently dropping any fleet-wide `model`
  # default for a project that didn't set its own — now routed through
  # model_for (regression test added). fleet/dashboard.py: new
  # render_settings_panel(fleet_config) — a read-only, collapsed table above
  # the card grid showing each project's EFFECTIVE model/run_mode/
  # permission_mode/backend/persona (reuses the same resolvers spawn_project
  # calls, so the panel can't drift from what actually spawns); create_dashboard_app
  # gains an optional fleet_config= kwarg that wires it in (omitted = pre-U24
  # page, byte-identical). All new symbols exported via fleet/__init__.
  # 26 new tests (config: model_for/persona_for precedence+defaults, blank/
  # duplicate/dangling persona-name validation, unknown-override KeyError;
  # session_manager: fleet-wide-model regression; dashboard: empty/populated/
  # HTML-escaped settings panel, index with/without fleet_config). Full
  # software suite (--ignore=tests/vision): 535 passed, 2 failed = the same
  # known pre-existing profile-loading failures (test_config_name_collisions /
  # test_external_loading, unrelated, documented since U1); tests/vision
  # torch-less collection error also pre-existing/unrelated, ignored per
  # standing guidance. HYGIENE: checked `claude agents --json` before and
  # after — only the 2 interactive human sessions present, no stray u12-steer
  # (or any) bg agent this iteration. Investigated the "leaves a stray
  # u12-steer bg agent on a full-suite run" report: read
  # test_real_bg_steering_round_trip (tests/fleet/test_manager.py) end to end
  # — it already wraps spawn/steer in try/finally with mgr.stop_and_remove()
  # unconditionally in finally, so a normal pass/fail/exception inside the
  # test body cannot leak. The actual leak vector (confirmed by JOURNAL
  # history: U16/U18/U23 each independently found+cleaned a stray u12-steer
  # agent from an EARLIER iteration, never from that same iteration's own
  # run) is an external hard-kill of pytest mid-run — a shell/tool timeout
  # SIGKILLing the process skips Python's `finally` entirely, since the CLAUDE
  # process itself hasn't returned control to Python. That mitigation is
  # already the standing guidance ("run pytest in the foreground WITHOUT a
  # shell timeout") and this iteration followed it (--timeout 600000ms,
  # completed at 226s). No code change made for this — the teardown logic
  # itself is correct; the fix is procedural and already in force. Visual
  # polish (dashboard settings panel) is HTML-only, not yet human-eyeballed;
  # noted as a light, non-blocking deferred_gates entry below. units_done
  # 21->22, current_phase 4->5.
  #
  # U25 (Phase 5) DONE — fleet skill (decision #18): a drive-loop variant
  # installed into manager sessions. fleet/skill.py: FLEET_SKILL_NAME
  # ("fleet-conventions") + build_fleet_skill_markdown (pure builder —
  # frontmatter + the three decision-#18 conventions: (1) orchestrate via
  # subagents/Workflows, one PR-sized unit per fresh-context iteration,
  # durable committed git state; (2) keep spoken replies short — the status
  # "summary" line IS a candidate for Reachy to speak aloud, so one natural
  # sentence; (3) escalate HUMAN_GATE by voice THROUGH the status file — the
  # exact status.json path + sentinel vocabulary are baked in, matching
  # build_drive_task, and the skill says never invent a separate escalation
  # channel; optional vision-tool clause when DriveLoopSpec.vision_command is
  # set) + fleet_skill_path (<repo>/.claude/skills/fleet-conventions/SKILL.md)
  # + write_fleet_skill_file (materializer; supervisor-authored teaching
  # content so it OVERWRITES by default on each spawn — the opposite of
  # write_plan_file's no-clobber, since the plan is the MANAGER's committed
  # output while the skill is ours; overwrite=False preserves a human-edited
  # copy). Wiring: DriveLoopSpec.install_skill (default True) —
  # spawn_drive_manager materializes the skill before spawn (mirroring
  # write_plan_file) and build_drive_task adds a FLEET SKILL prompt clause
  # pointing at it + telling the manager to teach it to any subagent it
  # spawns; install_skill=False omits both (fully backward-compatible
  # otherwise). Exported via fleet/__init__. Tested HEADLESS per acceptance:
  # 9 new tests (frontmatter, all three conventions + status path + sentinel
  # in content, vision clause optional, path shape, create + overwrite +
  # preserve, spawn installs by default + prompt references it, opt-out).
  # Full software suite (--ignore=tests/vision): 544 passed, 2 failed = the
  # same known pre-existing profile-loading failures (unrelated). HYGIENE:
  # `claude agents --json` after the run shows only the 2 interactive human
  # sessions — 0 stray bg agents. units_done 22->23; next_unit U26 (package
  # + publish — an APPROVAL gate; deps U24+U25 now both done).
  #
  # U26 (Phase 5) IN PROGRESS, APPROVAL-gated — packaging/licensing/secrets done
  # 2026-07-02; publish step deliberately NOT taken. See status.pending_approval_gate
  # for the full detail + exact copy-pasteable publish commands. units_done stays 23
  # (not done until the human confirms the publish).
  #
  # U20/U21 PROBLEM-FIX PASS (2026-07-03, human live test on the powered robot) —
  # both stay in status.deferred_gates (units_done unchanged, still 23; neither
  # counted done until the human re-confirms). U20: implemented
  # vision.default_robot_frame_provider() (lazy `reachy_mini` import, standalone
  # ReachyMini() client -> media.get_frame(), never fakes a frame) and wired it
  # into `fleet look --source camera` automatically (no extra flags); the
  # generic vision.look()/capture_robot_camera() API and its existing
  # hardware-gated tests are unchanged. U21: investigated all four requested
  # angles (attach reachability, edge-trigger parity with the confirmed-working
  # voice renderer, vision.look's already-exception-safe-but-under-logged
  # behavior, speak_threadsafe's silent no-op without a live connection);
  # couldn't conclusively pin the root cause without a live re-test, so added
  # attempt-level + speak-attempt logging (previously only failure/success were
  # logged) so the next live test's console pins it exactly. 10 new tests (8
  # vision: lazy-import guard, daemon-unreachable, no-frame-yet, happy-path, CLI
  # wiring x2; 2 observer: log-line assertions) — fleet+tools suite 560 passed,
  # only the 2 known pre-existing profile-loading failures remain. 0 stray bg
  # agents left by this iteration's own (fully mocked) tests; one leftover
  # `tester` bg agent from a PRIOR iteration's test run was found via `claude
  # agents --json` and stopped/removed during this iteration's hygiene check.
  # See status.deferred_gates U20/U21 for the updated copy-pasteable re-test
  # steps (U21's now include exactly which log lines to check for).
units:
  # ---------------- Phase 2 — Fleet core + observability + persistence ----------------
  - id: U1
    phase: 2
    title: Fleet config schema + loader
    gate: software
    status: done
    deps: []
    acceptance: "A `fleet` config (toml/json) lists projects {name, path, env, mcp[], defaults} and a default gate policy; typed loader + validation + tests."
  - id: U2
    phase: 2
    title: FleetManager over `claude --bg`
    gate: software
    status: done
    deps: [U1]
    acceptance: "Spawn a manager as a background agent (claude --bg --name --session-id --permission-mode … task), capture short id + sessionId; stop/rm; tests spawn a REAL trivial bg session, assert it appears in `claude agents --json`, then clean it up."
  - id: U3
    phase: 2
    title: SessionManager (track N + reconnect)
    gate: software
    status: done
    deps: [U2]
    acceptance: "Track N managers (spawn/list/stop); on startup reconnect to existing bg sessions from the daemon roster / `claude agents --json`. Tests cover reconnect-after-restart."
  - id: U4
    phase: 2
    title: FleetState model + poller (pub/sub)
    gate: software
    status: done
    deps: [U3]
    acceptance: "FleetState aggregates per-manager state by polling `claude agents --json` (+ logs); pub/sub so subscribers get updates; tests with fake + real bg sessions."
  - id: U5
    phase: 2
    title: Status convention (manager emits, fleet reads)  # decision #21
    gate: software
    status: done
    deps: [U4]
    acceptance: "Each manager writes a small status.json/journal (drive-loop report line) to a known place; FleetState merges it. Reachy/dashboard/CLI read status without interrupting the agent. Tested."
  - id: U6
    phase: 2
    title: Headless `fleet` CLI
    gate: software
    status: done
    deps: [U4]
    acceptance: "`fleet start|spawn|status|logs|stop` over SessionManager+FleetState — the headless dev/test harness. Tests drive it end-to-end against real trivial bg sessions."
  - id: U7
    phase: 2
    title: Read-only web dashboard
    gate: software
    status: done
    deps: [U4]
    acceptance: "FastAPI route on settings_app serving a 2–4 card grid rendering FleetState (status, tool, last line, transcript ring buffer) + a JSON poll endpoint; tests serve + assert HTTP/JSON. (Visual polish = optional light human check.)"
  - id: U8
    phase: 2
    title: Body renders FleetState
    gate: hardware
    status: done
    deps: [U4]
    acceptance: "Map fleet status → head/antenna signals (body yaw toward the manager needing attention; antenna = state). HUMAN_GATE: human powers robot (rear USB-C) and confirms the body signals the right manager."
  - id: U9
    phase: 2
    title: Per-agent identity (name/color) + 2–4 wiring
    gate: software
    status: done
    deps: [U4]
    acceptance: "Stable name + color per manager surfaced through FleetState/CLI/dashboard; designed for 2–4 concurrent. Tested."
  - id: U10
    phase: 2
    title: Phase 2 integration + docs
    gate: hardware
    status: done
    deps: [U5, U6, U7, U8, U9]
    acceptance: "Software integration test of the whole fleet core (autonomous). End-to-end with the robot (talk → spawn → observe on body + dashboard) = HUMAN_GATE. Update README/plan status."

  # ---------------- Phase 3 — Steering + plan-gated autonomy ----------------
  - id: U11
    phase: 3
    title: run_mode knob (background | remote-control)  # decision #19
    gate: software
    status: done
    deps: [U3]
    acceptance: "Manager model gains run_mode; background path fully wired+tested. remote-control spawn path implemented (claude --remote-control / server mode); RC live-connect verification = HUMAN_GATE (needs full claude.ai OAuth)."
  - id: U12
    phase: 3
    title: Interactive controls (CLI + dashboard)
    gate: software
    status: done
    deps: [U6, U7]
    acceptance: "approve gate / send message / pause-resume / spawn-kill / reassign. NB verify the non-interactive steering path for bg sessions (claude --resume <id> -p vs agent-view) — decision #16 open item; document the chosen mechanism. Tested."
  - id: U13
    phase: 3
    title: Managers run ralph/drive loops  # decision #15
    gate: software
    status: done
    deps: [U5]
    acceptance: "A manager can drive a /drive-* loop on its target repo; its HUMAN_GATE sentinel flows into FleetState. Integration tested (a manager driving a trivial sample repo)."
  - id: U14
    phase: 3
    title: Gate policy (config default + per-worker override)  # decision #13
    gate: software
    status: done
    deps: [U1, U13]
    acceptance: "Default gate policy in fleet config, overridable per worker/project; classification (autonomous vs escalate). Tested."
  - id: U15
    phase: 3
    title: Gate → voice escalation  # decision #17
    gate: hardware
    status: done
    deps: [U13, U14]
    acceptance: "HUMAN_GATE surfaces to the Realtime host and is spoken; the spoken answer resumes the loop. HUMAN_GATE: confirm by voice on the robot."
    notes: "Backlog (from U8 hardware feedback 2026-06-28): also have Reachy SPEAK the fleet status aloud (e.g. on a state change / on request — 'build failed', 'tests needs you'), not just signal it on the body. Body + voice are complementary renderers of FleetState; voice plumbing belongs here."
  - id: U16
    phase: 3
    title: Written plan file per manager
    gate: software
    status: done
    deps: [U13]
    acceptance: "A manager can be handed a plan.md-style file (task + gates = the drive contract's committed state). Tested."
  - id: U17
    phase: 3
    title: Voice interaction contract  # decision #20
    gate: hardware
    status: pending
    deps: [U11, U14]
    acceptance: "Persona + fleet-spawn tool: confirm task+location+run_mode (+non-default gates) by voice before kickoff ('just do it' skips); explain options + how to ask, with spoken examples. HUMAN_GATE: confirm on the robot."
  - id: U18
    phase: 3
    title: MCP-general per-worker MCP config
    gate: software
    status: done
    deps: [U1, U2]
    acceptance: "Per-worker MCP servers wired through spawn (--mcp-config); a manager can drive an MCP-backed target (e.g. Unreal 5.8 MCP as a test target — config only, no hard dependency). Tested."

  # ---------------- Phase 4 — Vision + local backends ----------------
  - id: U19
    phase: 4
    title: Pluggable coding backend (Ollama local model)  # decision #14, option 1
    gate: software
    status: done
    deps: [U2]
    acceptance: "Per-worker backend selection: Claude Code (Max) or Claude Code routed at a local Ollama model via ANTHROPIC_BASE_URL in the project's .claude/settings.json env (bg sessions don't inherit it from the shell, v2.1.174+). Config + tests; if no local Ollama present → HUMAN_GATE to set it up (ideally on the 5090)."
  - id: U20
    phase: 4
    title: Vision — worker-callable tool  # decision #9
    gate: hardware
    status: done
    notes: "Software slice done 2026-07-02 (screen-capture path + gated camera seam); robot-camera verification recorded in status.deferred_gates (non-blocking, human choice 2026-07-02)."
    deps: [U13]
    acceptance: "A worker tool 'look at what I built': screen capture (digital) or robot camera (physical) → assessment back into the loop. Screen-capture path software-testable; robot-camera path = HUMAN_GATE. Reuse .phase0/vision_ref."
  - id: U21
    phase: 4
    title: Vision — supervisor observer
    gate: hardware
    status: done
    notes: "Software slice done 2026-07-02 (FleetObserver: edge-triggered glance-on-completion -> vision.look -> spoken comment; wired in main.py); robot verification recorded in status.deferred_gates (non-blocking, human choice 2026-07-02)."
    deps: [U20]
    acceptance: "Reachy proactively glances + comments on fleet work. HUMAN_GATE: confirm on the robot."
  - id: U22
    phase: 4
    title: 5090 local voice mode (CUDA Whisper + neural TTS)
    gate: hardware
    status: pending
    deps: []
    acceptance: "OpenAI-free brain (CUDA Whisper + Kokoro/XTTS) as a fallback. HUMAN_GATE: needs the 5090 + audio hardware to verify."
  - id: U23
    phase: 4
    title: Rate-limit + robustness hardening
    gate: software
    status: done
    deps: [U3]
    acceptance: "Backoff/handling for N managers sharing one Max pool; recovery paths. Tested."

  # ---------------- Phase 5 — Customization + share ----------------
  - id: U24
    phase: 5
    title: Customization (keys/models/projects/personas) + UI polish
    gate: software
    status: done
    notes: "Software slice done 2026-07-02 (PersonaConfig + model_for/persona_for resolvers + dashboard settings panel); visual check recorded in status.deferred_gates (non-blocking, light-check acceptance)."
    deps: [U7, U11]
    acceptance: "User-configurable keys, models, projects, personas; dashboard polish. Tested (visual = light human check)."
  - id: U25
    phase: 5
    title: Fleet skill (drive-loop variant for managers)  # decision #18
    gate: software
    status: done
    notes: "Done 2026-07-02: fleet/skill.py (build_fleet_skill_markdown + write_fleet_skill_file -> <repo>/.claude/skills/fleet-conventions/SKILL.md) installed by spawn_drive_manager (DriveLoopSpec.install_skill, default True; opt-out tested). Headless: 9 new tests, full suite 544 green."
    deps: [U13]
    acceptance: "A skill installed into manager sessions: orchestrate via subagents/Workflows, short spoken replies, escalate HUMAN_GATE by voice. Tested headless."
  - id: U26
    phase: 5
    title: Package + publish as a Reachy Mini app on Hugging Face
    gate: approval
    status: in_progress
    notes: "Packaging/licensing/secrets done 2026-07-02 (pyproject license+keywords, NOTICE, README license frontmatter + secrets section, test_packaging.py); publish step requires explicit human go-ahead, see status.pending_approval_gate."
    deps: [U24, U25]
    acceptance: "Package the app; sort licensing (Pollen base + additions) + secrets handling. Implement up to the publish step, then HUMAN_GATE for explicit go-ahead. NEVER publish autonomously."
