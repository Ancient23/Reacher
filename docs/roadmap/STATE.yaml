      steps: |
        1. Start the app (cd reachy_fleet_supervisor; ./run.ps1) with a fleet
           config that has 1-2 projects, then open http://localhost:<port>/fleet.
        2. LOOK: a collapsed "fleet settings (N project(s))" panel appears
           above the card grid; expanding it shows a small table with each
           project's effective model/run mode/permission/backend/persona and
           reads cleanly (no overflow/clipping) alongside the existing wide
           cards.
