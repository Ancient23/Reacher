    - unit: U20
      title: Vision worker tool — robot-camera path
      note: >
        PROBLEM-FIX 2026-07-03 (human live test reported "no frame provider
        wired" — the camera seam existed but NOTHING wired the real robot
        camera). Fixed: fleet/vision.py gained default_robot_frame_provider()
