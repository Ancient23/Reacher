    steps: |
      These are the exact commands to run yourself when you're ready to make the app
      public. Nothing has been pushed or made public yet.
      1. Log in to Hugging Face (once, if not already): from anywhere,
             hf auth login
         (or the older `huggingface-cli login`) and paste a token with `write` scope
         from https://huggingface.co/settings/tokens.
      2. Create the Space (pick your own <your-hf-username>/<space-name>, e.g.
         reachy-fleet-supervisor):
             hf repo create <your-hf-username>/<space-name> --type space --space_sdk static
      3. From the repo root, push this app's subfolder as that Space's content
         (a plain git push works because HF Spaces are git repos):
             cd reachy_fleet_supervisor
             git init -b main .hf-space-push          # only if you want a clean throwaway remote checkout;
                                                        # simplest is instead, from reachy_fleet_supervisor/:
             git remote add hf https://huggingface.co/spaces/<your-hf-username>/<space-name>
             git push hf HEAD:main
         (If reachy_fleet_supervisor/ isn't its own git repo, use
          `git subtree push --prefix reachy_fleet_supervisor hf main`, run from the
          monorepo root, instead of steps above.)
      4. In the Space's Settings -> "Variables and secrets", add OPENAI_API_KEY (and
         HF_TOKEN only if you need gated model/dataset access) as SECRETS, not
         variables. Do not commit a .env file.
      5. Confirm the Space builds and the README/index.html landing page renders as
         expected; report PASS/PROBLEM back to the loop. A PASS marks U26 done; a
         PROBLEM (e.g. missing dependency, bad entry point) should describe exactly
         what broke so the next worker can fix it in place (U26 stays in_progress).
